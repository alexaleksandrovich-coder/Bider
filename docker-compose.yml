# Base compose: app + postgres. Works for local rehearsal and VPS alike.
# Prod usage (as in Repraiser):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Secrets live in .env on the host (see .env.prod.example); nothing secret here.
name: bider

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bider}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bider}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bider} -d ${POSTGRES_DB:-bider}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      # Built from the same POSTGRES_* the postgres service uses — single source of truth.
      BIDER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bider}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bider}
    ports:
      # Loopback-only by default; a TLS reverse proxy (Caddy) sits in front.
      - "${PORT_PUBLISHED:-127.0.0.1:8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
