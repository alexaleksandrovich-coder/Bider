<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bider{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">Bider</a>
    <a href="/">Обзор</a>
    <a href="/admin/cabinets">Кабинеты</a>
    <a href="/items">Товары</a>
    <a href="/hours">Часы</a>
    <a href="/schedules">Расписания</a>
    <a href="/health-page">Health</a>
    {% if user %}
    <form method="post" action="/logout" class="inline">
      <button type="submit">Выйти</button>
    </form>
    {% endif %}
  </nav>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <!-- htmx 2.0.4, vendored from https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js -->
  <script src="/static/vendor/htmx.min.js" defer></script>
</body>
</html>
