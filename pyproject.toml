[project]
name = "bider"
version = "0.1.0"
description = "Read-only WB ads collector + dashboard (bider MVP-1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "sqlalchemy",
    "greenlet",  # required by sqlalchemy's asyncio extension
    "alembic",
    "asyncpg",
    "httpx",
    "cryptography",
    "pydantic-settings",
    "tzdata",  # IANA tz database for zoneinfo on Windows / slim images
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Alembic's template for autogenerated revisions uses Union/typing.Sequence
# style; don't fight the generator on every new migration.
"migrations/versions/*" = ["I001", "UP007", "UP035"]
